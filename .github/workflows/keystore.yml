name: keystore (tek seferlik yükleme anahtarı)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Anahtar zaten var mı
        run: |
          if [ -f app/android/upload-keystore.jks.enc ]; then
            echo "::error::Şifreli anahtar zaten depoda. Yeniden üretilmez (Play yükleme anahtarı değişmemeli)."; exit 1
          fi
          [ -n "$SIGNING_PASSPHRASE" ] || { echo "::error::SIGNING_PASSPHRASE gizli değeri yok"; exit 1; }
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
      - name: Anahtarı üret ve şifrele
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -e
          keytool -genkeypair -v -keystore upload-keystore.jks -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass:env SIGNING_PASSPHRASE -keypass:env SIGNING_PASSPHRASE \
            -dname "CN=Demir Games Studio, O=Demir Games Studio, C=TR"
          echo "Sertifika parmak izleri (herkese açık bilgi):"
          keytool -list -v -keystore upload-keystore.jks -storepass:env SIGNING_PASSPHRASE | grep -E "SHA1:|SHA256:"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SIGNING_PASSPHRASE \
            -in upload-keystore.jks -out app/android/upload-keystore.jks.enc
          rm -f upload-keystore.jks
      - name: Şifreli anahtarı depoya koy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android/upload-keystore.jks.enc
          git commit -m "Şifreli Play yükleme anahtarı (SIGNING_PASSPHRASE ile çözülür)"
          git push origin HEAD:${GITHUB_REF_NAME}
