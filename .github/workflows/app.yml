name: app

on:
  push:
    branches-ignore: [ci-ciktilar]
    paths:
      - "app/**"
      - "i18n/**"
      - "design/tokens-a.css"
      - "design/fonts/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"
  PKG: com.demirgamesstudio.mozaikmantik

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Üretilen dosyalar kaynakla aynı mı (tokens + i18n)
        run: |
          python3 app/tool/gen_tokens.py
          python3 app/tool/sync_i18n.py
          git diff --exit-code -- app/lib/theme/tokens.dart app/assets/i18n \
            || { echo "::error::Üretilen dosyalar kaynakla uyuşmuyor; betikleri çalıştırıp commit'le"; exit 1; }
      - run: flutter --version
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  build:
    name: build apk + aab
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/ci-iskelet' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Release APK (anahtar yoksa debug imza)
        run: flutter build apk --release
        working-directory: app
      - name: Release AAB
        run: flutter build appbundle --release
        working-directory: app
      - name: Boyutlar
        run: ls -l app/build/app/outputs/flutter-apk/*.apk app/build/app/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

  emulator-smoke:
    name: emulator açılış testi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash app/tool/smoke.sh apk/app-release.apk ${{ env.PKG }} smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 3

  publish:
    name: çıktıları ci-ciktilar dalına koy
    needs: [analyze, build, emulator-smoke]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-out
          path: smoke-out
        continue-on-error: true
      - name: Dala yaz (APK/AAB YOK; yalnız ekran görüntüsü + rapor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          git clone --no-tags --depth 1 --branch ci-ciktilar "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null \
            || { git init -q out && cd out && git checkout -q --orphan ci-ciktilar && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" && cd ..; }
          D="out/app/${SLUG}"
          mkdir -p "$D"
          [ -f smoke-out/ekran.png ] && cp smoke-out/ekran.png "$D/ekran.png"
          [ -f smoke-out/logcat.txt ] && tail -n 300 smoke-out/logcat.txt > "$D/logcat-son300.txt"
          {
            echo "# app CI raporu"
            echo "- dal: ${GITHUB_REF_NAME}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- run: ${GITHUB_RUN_ID} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- analyze+test: ${{ needs.analyze.result }}"
            echo "- build: ${{ needs.build.result }}"
            echo "- emulator-smoke: ${{ needs.emulator-smoke.result }}"
            echo "- flutter: ${FLUTTER_VERSION}"
            echo '```'
            cat smoke-out/smoke.txt 2>/dev/null || echo "smoke.txt yok"
            echo '```'
          } > "$D/rapor.md"
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: app çıktıları (${SLUG}, run ${GITHUB_RUN_ID})" || { echo "değişiklik yok"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:ci-ciktilar && break
            git pull -q --rebase origin ci-ciktilar || true
          done
