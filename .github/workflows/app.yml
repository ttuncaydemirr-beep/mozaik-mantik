name: app

on:
  push:
    branches-ignore: [ci-ciktilar]
    paths:
      - "app/**"
      - "packages/**"
      - "i18n/**"
      - "design/tokens-a.css"
      - "design/fonts/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      play:
        description: "AAB'yi Google Play'e yükle"
        type: boolean
        default: false
      track:
        description: "Play kanalı (internal | alpha = kapalı test)"
        type: string
        default: internal
      status:
        description: "Sürüm durumu (taslak uygulamada yalnız draft kabul edilir)"
        type: string
        default: draft

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"
  PKG: com.demirgamesstudio.mozaikmantik

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Üretilen dosyalar kaynakla aynı mı (tokens + i18n)
        run: |
          python3 app/tool/gen_tokens.py
          python3 app/tool/sync_i18n.py
          git diff --exit-code -- app/lib/theme/tokens.dart app/assets/i18n \
            || { echo "::error::Üretilen dosyalar kaynakla uyuşmuyor; betikleri çalıştırıp commit'le"; exit 1; }
      - run: flutter --version
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  build:
    name: build apk + aab
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/ci-iskelet' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Yükleme anahtarını çöz (varsa)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -f app/android/upload-keystore.jks.enc ] && [ -n "$SIGNING_PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE \
              -in app/android/upload-keystore.jks.enc -out app/android/app/upload-keystore.jks
            umask 077
            printf 'storeFile=upload-keystore.jks\nkeyAlias=upload\nstorePassword=%s\nkeyPassword=%s\n' "$SIGNING_PASSPHRASE" "$SIGNING_PASSPHRASE" > app/android/key.properties
            echo "Gerçek yükleme anahtarıyla imzalanacak."
          else
            echo "::warning::Yükleme anahtarı yok; debug imza kullanılacak (Play'e yüklenemez)."
          fi
      - name: Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        working-directory: app
      - name: Release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
        working-directory: app
      - name: Anahtar dosyalarını sil
        if: always()
        run: rm -f app/android/app/upload-keystore.jks app/android/key.properties
      - name: Boyutlar
        run: ls -l app/build/app/outputs/flutter-apk/*.apk app/build/app/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

  emulator-smoke:
    name: emulator açılış testi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash app/tool/smoke.sh apk/app-release.apk ${{ env.PKG }} smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 3

  publish:
    name: çıktıları ci-ciktilar dalına koy
    needs: [analyze, build, emulator-smoke]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-out
          path: smoke-out
        continue-on-error: true
      - name: Dala yaz (APK/AAB YOK; yalnız ekran görüntüsü + rapor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          git clone --no-tags --depth 1 --branch ci-ciktilar "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null \
            || { git init -q out && cd out && git checkout -q --orphan ci-ciktilar && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" && cd ..; }
          D="out/app/${SLUG}"
          mkdir -p "$D"
          [ -f smoke-out/ekran.png ] && cp smoke-out/ekran.png "$D/ekran.png"
          [ -f smoke-out/logcat.txt ] && tail -n 300 smoke-out/logcat.txt > "$D/logcat-son300.txt"
          {
            echo "# app CI raporu"
            echo "- dal: ${GITHUB_REF_NAME}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- run: ${GITHUB_RUN_ID} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- analyze+test: ${{ needs.analyze.result }}"
            echo "- build: ${{ needs.build.result }}"
            echo "- emulator-smoke: ${{ needs.emulator-smoke.result }}"
            echo "- flutter: ${FLUTTER_VERSION}"
            echo '```'
            cat smoke-out/smoke.txt 2>/dev/null || echo "smoke.txt yok"
            echo '```'
          } > "$D/rapor.md"
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: app çıktıları (${SLUG}, run ${GITHUB_RUN_ID})" || { echo "değişiklik yok"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:ci-ciktilar && break
            git pull -q --rebase origin ci-ciktilar || true
          done

  play-upload:
    name: Google Play'e yükle
    needs: [build, emulator-smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.play && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aab
          path: aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PKG }}
          releaseFiles: aab/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
